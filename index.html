<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Комната</title>
    <style>
      :root {
        --bg: #1a1a1a;
        --card: #262626;
        --line: #3a3a3a;
        --text: #d1d1d1;
        --muted: #8c8c8c;
        --accent: #4f4f4f;
        --accent-hover: #5c5c5c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.4 system-ui,
          sans-serif;
      }
      .hidden {
        display: none !important;
      }
      input,
      button,
      textarea {
        font: inherit;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        padding: 11px 14px;
      }
      input:focus,
      textarea:focus {
        outline: 2px solid var(--muted);
        border-color: transparent;
      }
      button {
        cursor: pointer;
        background: var(--accent);
        border: none;
        color: var(--text);
        font-weight: 600;
        transition: background 0.2s;
      }
      button:hover {
        background: var(--accent-hover);
      }
      button.ghost {
        background: var(--card);
        border: 1px solid var(--line);
        color: var(--text);
      }
      button.ghost:hover {
        background: var(--line);
      }

      #home {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .box {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      textarea {
        resize: none;
        height: 80px;
        font-family: monospace;
        font-size: 12px;
      }
      #err {
        color: #ff8a8a;
        font-size: 13px;
        min-height: 18px;
      }

      .code-row {
        display: flex;
        gap: 8px;
        margin-top: 5px;
      }
      .code-row textarea {
        flex: 1;
      }
      .code-row button {
        padding: 0 15px;
      }

      #room {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: #1e1e1e;
      }
      header .sp {
        flex: 1;
      }
      #main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #stage {
        background: #111;
        aspect-ratio: 16/9;
        width: 100%;
        max-height: 55vh;
        display: grid;
        place-items: center;
      }
      #stage video,
      #stage iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      #urlbar {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      #chat {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: #1e1e1e;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .msg b {
        color: #e0e0e0;
        font-weight: 600;
      }
      .sys {
        color: var(--muted);
        font-size: 13px;
        font-style: italic;
      }
      #send {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
      }
      #send input {
        flex: 1;
        min-width: 0;
      }

      @media (min-width: 900px) {
        #main {
          flex-direction: row;
        }
        #left {
          flex: 1;
          min-width: 0;
          display: flex;
          flex-direction: column;
        }
        #stage {
          max-height: none;
          flex: 1;
          aspect-ratio: auto;
        }
        #chat {
          width: 340px;
          flex: none;
          border-left: 1px solid var(--line);
        }
      }
      #left {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="home">
      <div class="box">
        <div>
          <div class="muted" style="margin-bottom: 8px">Создание</div>
          <input
            id="nickHost"
            placeholder="Имя"
            style="width: 100%; margin-bottom: 8px"
          />
          <button id="btnCreateOffer" style="width: 100%">Создать</button>
          <div id="offerBox" class="hidden" style="margin-top: 10px">
            <div class="muted" style="margin-bottom: 4px">Код приглашения:</div>
            <div class="code-row">
              <textarea id="offerCode" readonly></textarea>
              <button id="btnCopyOffer">Скопировать</button>
            </div>
            <div class="muted" style="margin-top: 10px; margin-bottom: 4px">
              Вставьте ответ:
            </div>
            <textarea id="answerIn" placeholder="Ответный код..."></textarea>
            <button id="btnAcceptAnswer" style="width: 100%; margin-top: 8px">
              Завершить
            </button>
          </div>
        </div>

        <hr style="border-color: var(--line); width: 100%; margin: 15px 0" />

        <div>
          <div class="muted" style="margin-bottom: 8px">Соединение</div>
          <input
            id="nickGuest"
            placeholder="Имя"
            style="width: 100%; margin-bottom: 8px"
          />
          <textarea
            id="offerIn"
            placeholder="Вставьте код от хоста..."
          ></textarea>
          <button id="btnAcceptOffer" style="width: 100%; margin-top: 8px">
            Принять
          </button>
          <div id="answerBox" class="hidden" style="margin-top: 10px">
            <div class="muted" style="margin-bottom: 4px">Ваш ответ:</div>
            <div class="code-row">
              <textarea id="answerCode" readonly></textarea>
              <button id="btnCopyAnswer">Скопировать</button>
            </div>
            <div class="muted" style="margin-top: 8px">
              Отправьте этот код хосту.
            </div>
          </div>
        </div>

        <div id="err"></div>
      </div>
    </div>

    <div id="room" class="hidden">
      <header>
        <span class="muted">Вы:</span
        ><span
          class="code"
          id="myNick"
          style="color: var(--text); font-weight: bold"
        ></span>
        <span class="sp"></span>
        <button class="ghost" id="btnLeave">Выйти</button>
      </header>
      <div id="main">
        <div id="left">
          <div id="urlbar" class="hidden">
            <div class="row">
              <input id="urlIn" placeholder="Вставьте ссылку" />
              <button id="btnLoad">Загрузить</button>
            </div>
          </div>
          <div id="stage">
            <div id="empty" class="muted">Видео пока не выбрано</div>
          </div>
        </div>
        <div id="chat">
          <div id="log"></div>
          <form id="send">
            <input
              id="msgIn"
              placeholder="Сообщение..."
              maxlength="500"
            /><button>→</button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let pc,
        dc,
        isHost = false,
        nick = "";
      let current = { url: "", kind: "" };
      let player = null;
      let ignoreUntil = 0,
        playing = false;
      let isConnected = false;

      const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

      window.addEventListener("beforeunload", (event) => {
        if (isConnected) {
          event.preventDefault();
          event.returnValue = "";
        }
      });

      function err(t) {
        $("err").textContent = t;
      }
      function addLog(text, cls, who) {
        const d = document.createElement("div");
        d.className = cls || "msg";
        if (who) {
          const b = document.createElement("b");
          b.textContent = who + ": ";
          d.appendChild(b);
        }
        d.appendChild(document.createTextNode(text));
        $("log").appendChild(d);
        $("log").scrollTop = 1e9;
      }

      async function copyText(elementId, btnElement) {
        const text = $(elementId).value;
        try {
          await navigator.clipboard.writeText(text);
          const originalText = btnElement.textContent;
          btnElement.textContent = "Скопировано!";
          setTimeout(() => (btnElement.textContent = originalText), 1500);
        } catch (err) {
          $(elementId).select();
          document.execCommand("copy");
          btnElement.textContent = "Скопировано!";
          setTimeout(() => (btnElement.textContent = "Скопировать"), 1500);
        }
      }

      $("btnCopyOffer").onclick = () =>
        copyText("offerCode", $("btnCopyOffer"));
      $("btnCopyAnswer").onclick = () =>
        copyText("answerCode", $("btnCopyAnswer"));

      $("btnCreateOffer").onclick = async () => {
        nick = $("nickHost").value.trim() || "Хост";
        isHost = true;
        err("Создание...");
        pc = new RTCPeerConnection(config);

        dc = pc.createDataChannel("chat");
        setupDataChannel();

        pc.onicecandidate = (e) => {
          if (!e.candidate) {
            $("offerCode").value = btoa(JSON.stringify(pc.localDescription));
            $("offerBox").classList.remove("hidden");
            err("");
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
      };

      $("btnAcceptAnswer").onclick = async () => {
        try {
          const answer = JSON.parse(atob($("answerIn").value.trim()));
          await pc.setRemoteDescription(new RTCSessionDescription(answer));
          err("Соединение...");
        } catch (e) {
          err("Неверный ответный код");
        }
      };

      $("btnAcceptOffer").onclick = async () => {
        nick = $("nickGuest").value.trim() || "Гость";
        isHost = false;
        err("Соединение...");
        try {
          const offer = JSON.parse(atob($("offerIn").value.trim()));
          pc = new RTCPeerConnection(config);

          pc.ondatachannel = (e) => {
            dc = e.channel;
            setupDataChannel();
          };

          pc.onicecandidate = (e) => {
            if (!e.candidate) {
              $("answerCode").value = btoa(JSON.stringify(pc.localDescription));
              $("answerBox").classList.remove("hidden");
              err("");
            }
          };

          await pc.setRemoteDescription(new RTCSessionDescription(offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
        } catch (e) {
          err("Неверный код приглашения");
        }
      };

      function setupDataChannel() {
        dc.onopen = () => {
          isConnected = true;
          enterRoom();
          if (!isHost) dc.send(JSON.stringify({ t: "hello", nick }));
        };

        dc.onclose = () => {
          addLog("Собеседник вышел из комнаты", "sys");
          isConnected = false;
        };

        dc.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          switch (msg.t) {
            case "chat":
              addLog(msg.text, "msg", msg.nick);
              break;
            case "sys":
              addLog(msg.text, "sys");
              break;
            case "hello":
              if (isHost) {
                if (current.url)
                  dc.send(
                    JSON.stringify({
                      t: "state",
                      url: current.url,
                      playing,
                      time: player ? player.time() : 0,
                    }),
                  );
                addLog(msg.nick + " зашел", "sys");
              }
              break;
            case "video":
              loadVideo(msg.url, false);
              break;
            case "state":
              loadVideo(msg.url, false, () => {
                if (msg.playing)
                  remote(() => {
                    player.seek(msg.time);
                    player.play();
                  });
                else remote(() => player.seek(msg.time));
              });
              break;
            case "play":
              remote(() => {
                syncTime(msg.time);
                player && player.play();
              });
              break;
            case "pause":
              remote(() => {
                syncTime(msg.time);
                player && player.pause();
              });
              break;
            case "seek":
              remote(() => {
                player && player.seek(msg.time);
              });
              break;
          }
        };
      }

      function enterRoom() {
        $("home").classList.add("hidden");
        $("room").classList.remove("hidden");
        $("myNick").textContent = nick;
        $("urlbar").classList.toggle("hidden", !isHost);
      }

      function syncTime(t) {
        if (player && Math.abs(player.time() - t) > 0.7) player.seek(t);
      }
      function remote(fn) {
        ignoreUntil = Date.now() + 900;
        try {
          fn();
        } catch (e) {}
      }
      function local(type) {
        if (Date.now() < ignoreUntil || !player) return;
        const time = player.time();
        if (type === "play") playing = true;
        if (type === "pause") playing = false;
        if (dc && dc.readyState === "open")
          dc.send(JSON.stringify({ t: type, time }));
      }

      function detect(url) {
        const m = url.match(
          /rutube\.ru\/(?:video|play\/embed)\/(?:private\/)?([a-f0-9]{32})/i,
        );
        if (m) return { kind: "rutube", id: m[1] };
        if (/\.(mp4|webm|ogg|m3u8)(\?|#|$)/i.test(url)) return { kind: "file" };
        return { kind: "unknown" };
      }

      function loadVideo(url, announce, ready) {
        const info = detect(url);
        if (info.kind === "unknown")
          return addLog("Ссылка не поддерживается.", "sys");
        if (player) player.destroy();
        const stage = $("stage");
        stage.innerHTML = "";
        current = { url, kind: info.kind };
        playing = false;
        player =
          info.kind === "rutube"
            ? rutubePlayer(stage, info, ready)
            : filePlayer(stage, url, ready);
        if (announce && dc && dc.readyState === "open")
          dc.send(JSON.stringify({ t: "video", url }));
      }

      function filePlayer(stage, url, ready) {
        const v = document.createElement("video");
        v.controls = true;
        v.playsInline = true;
        stage.appendChild(v);
        v.src = url;
        v.addEventListener("play", () => local("play"));
        v.addEventListener("pause", () => local("pause"));
        v.addEventListener("seeked", () => local("seek"));
        if (ready)
          v.addEventListener("loadedmetadata", () => ready(), { once: true });
        return {
          play: () => v.play().catch(() => addLog("Нажмите Play", "sys")),
          pause: () => v.pause(),
          seek: (t) => {
            v.currentTime = t;
          },
          time: () => v.currentTime,
          destroy: () => v.remove(),
        };
      }

      function rutubePlayer(stage, info, ready) {
        const f = document.createElement("iframe");
        f.allow = "autoplay; fullscreen";
        f.allowFullscreen = true;
        f.src = "https://rutube.ru/play/embed/" + info.id;
        stage.appendChild(f);
        let t = 0;
        let lastState = "paused";
        const onMsg = (e) => {
          let m;
          try {
            m = JSON.parse(e.data);
          } catch (_) {
            return;
          }
          if (m.type === "player:currentTime") t = m.data.time;
          if (m.type === "player:changeState") {
            if (m.data.state === "playing" && lastState !== "playing") {
              lastState = "playing";
              local("play");
            }
            if (m.data.state === "paused" && lastState === "playing") {
              lastState = "paused";
              local("pause");
            }
          }
        };
        window.addEventListener("message", onMsg);
        return {
          play: () =>
            f.contentWindow.postMessage(
              JSON.stringify({ type: "player:play" }),
              "*",
            ),
          pause: () =>
            f.contentWindow.postMessage(
              JSON.stringify({ type: "player:pause" }),
              "*",
            ),
          seek: (x) => {
            f.contentWindow.postMessage(
              JSON.stringify({
                type: "player:setCurrentTime",
                data: { time: x },
              }),
              "*",
            );
          },
          time: () => t,
          destroy: () => {
            window.removeEventListener("message", onMsg);
            f.remove();
          },
        };
      }

      $("btnLoad").onclick = () => {
        const u = $("urlIn").value.trim();
        if (u) loadVideo(u, true);
      };
      $("send").onsubmit = (e) => {
        e.preventDefault();
        const text = $("msgIn").value.trim();
        if (!text) return;
        $("msgIn").value = "";
        addLog(text, "msg", nick);
        if (dc && dc.readyState === "open")
          dc.send(JSON.stringify({ t: "chat", nick, text }));
      };

      $("btnLeave").onclick = () => {
        isConnected = false;
        location.reload();
      };
    </script>
  </body>
</html>
